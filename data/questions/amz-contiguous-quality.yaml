id: amz-contiguous-quality
title: Minimize cost to make equal qualities contiguous
type: dsa
tags: [oa-custom]
topics: [arrays, greedy]
difficulty: hard
status: extracted
confidence: high
evidence: live-prompt
prompt: |
  Given an array `quality`, you want all equal values to be contiguous. Each operation replaces *all* occurrences of one value with another value, at a cost equal to the count of items replaced. Return the minimum total cost. Function `getMinAmount`.
examples:
  - input: '[7,7,5,7,3,5,3]'
    output: '4'
  - input: '[1,2,1,2,1]'
    output: '2'
  - input: '[10,6,10,-3,1,1,4,-4,-1,1,-7]'
    output: '4'
constraints: |
  n up to 2e5, values in [-1e9, 1e9]
solution:
  approach: |
    Equal values must form one block. Paying to recolor a value is cheaper than leaving split groups. Work from frequencies and the spans of each value.
  complexity:
    time: O(n log n) or better depending on grouping
    space: O(n)
  links: [https://claude.ai/chat/82ff2a91-fd70-4443-94bd-1272f1d7431a]
