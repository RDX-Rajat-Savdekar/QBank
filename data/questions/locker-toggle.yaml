id: locker-toggle
title: Locker toggle
type: dsa
tags: [practice]
topics: [math]
difficulty: easy
status: extracted
confidence: high
evidence: practice-curriculum
prompt: |
  There are `x` lockers, all starting closed. You make `x` passes; on pass `i` you toggle every `i`-th locker. After all passes, how many (and which) lockers are open?
examples:
  - input: 'x = 10'
    output: 'lockers 1,4,9 open (perfect squares)'
  - input: 'x = 5'
    output: 'lockers 1,4 open'
follow_ups:
  - text: 'What changes if all lockers start open instead of closed?'
    kind: 'variant'
solution:
  approach: |
    Locker k is toggled once per divisor. Odd number of toggles iff k is a perfect square.
