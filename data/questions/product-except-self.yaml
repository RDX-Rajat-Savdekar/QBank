          pass
  
  # print(Solution().productExceptSelf(...))  # e.g. nums = [1,2,3,4]
solution:
  approach: |
    Prefix products left-to-right, then multiply suffix products right-to-left into the output.
  complexity:
    time: O(n)
    space: O(1) extra
  code: |
    function productExceptSelf(nums) {
      const n = nums.length
      const out = Array(n).fill(1)
      let prefix = 1
      for (let i = 0; i < n; i++) {
        out[i] = prefix
        prefix *= nums[i]
      }
      let suffix = 1
      for (let i = n - 1; i >= 0; i--) {
        out[i] *= suffix
        suffix *= nums[i]
      }
      return out
    }
