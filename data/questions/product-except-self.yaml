prompt: |
  Given an array `nums`, return an array `answer` such that `answer[i]` equals the product of all elements of `nums` except `nums[i]`. Solve without division (and ideally in O(1) extra space, output array aside).
examples:
  - input: '[1,2,3,4]'
    output: '[24,12,8,6]'
constraints: |
  - `2 <= nums.length <= 10^5`
  - `-30 <= nums[i] <= 30`
  - The input is generated such that `answer[i]` is guaranteed to fit in a 32-bit integer.
  Follow up: Can you solve the problem in `O(1)` extra space complexity? (The output array does not count as extra space for space complexity analysis.)
starter: |
