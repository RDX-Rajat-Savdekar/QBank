follow_ups:
  - text: Terabytes of data — partition by TLD (by last two labels for skewed 'com'), broadcast the ~1000 single-label scores; or sort by reversed labels and stream with an O(depth) ancestor stack (cost moves to external sort)
    kind: scale
  - text: "Feature pivot — subtree sum for every domain: add each score into itself and all parents' running totals, or build a label trie and do one post-order DFS"
    kind: variant
  - text: Many inputs / updates — compute leaf structure once from names, then each score dict costs only the sums; a single score change by delta only affects leaves beneath it
    kind: variant
solution:
  approach: |
    Two passes. A domain's name already encodes its parents: split on
    dots, parents are the suffix joins. Pass 1: add every parent of every
    domain to a has_subdomain set; anything not in it is a leaf. Pass 2:
    for each leaf, sum scores.get(name, 0) over itself and its parents.
    Split on labels (never endswith), so bigtest.com is never treated as
    a child of test.com. Domain names cap at 253 chars, so label counts
    are effectively constant — linear in n.
  complexity:
    time: O(n * k * L), effectively O(n)
    space: O(n * k * L)
  code: |
    def _self_and_parents(domain: str) -> list[str]:
        """Returns the domain followed by each of its parent domains."""
        labels = domain.split(".")
        return [".".join(labels[i:]) for i in range(len(labels))]


    def main(scores: dict[str, int]) -> dict[str, int]:
        """Finds the tree score of every leaf domain."""
        has_subdomain: set[str] = set()
        for domain in scores:
            has_subdomain.update(_self_and_parents(domain)[1:])

        leaf_scores: dict[str, int] = {}
        for domain in scores:
            if domain in has_subdomain:
                continue
            leaf_scores[domain] = sum(
                scores.get(name, 0) for name in _self_and_parents(domain))
        return leaf_scores
  code_language: python
  pitfalls:
    - Misreading 'leaf' (spec wording is backwards vs the example) — clarify leaf = no subdomain under it in input
    - Using endswith('.' + name) or substring matching instead of whole-label parents (test.mydomain.com vs test.com trap)
    - Mutating the input dict instead of returning a new one
