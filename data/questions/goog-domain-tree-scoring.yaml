prompt: |
  Input: a dictionary mapping domain names to integer scores. Output: a
  dictionary containing only leaf domains, each mapped to its tree
  score: its own score plus the scores of all its parent domains
  (e.g. mail.test.com -> test.com -> com). A leaf is a domain with no
  subdomain in the input (no other input domain ends with '.' + it). A
  parent is formed by stripping the leftmost label (whole labels only);
  a parent missing from the input counts 0. Return a new dict; do not
  modify the input. Scores may be negative.
examples:
  - input: '{"test.mydomain.com": 10, "mail.test.mydomain.com": 15, "test.com": -10, "com": 20, "mydomain.com": 5, "www.mydomain.com": 10, "mail.test.com": 10, "www.test.com": -5}'
    output: '{"mail.test.mydomain.com": 50, "www.mydomain.com": 35, "mail.test.com": 20, "www.test.com": 5}'
    explanation: mail.test.mydomain.com = 15 + 10 + 5 + 20 = 50; test.mydomain.com and test.com look related but are not (whole-label parents only)
  - input: "{}"
    output: "{}"
  - input: '{"com": 5}'
    output: '{"com": 5}'
