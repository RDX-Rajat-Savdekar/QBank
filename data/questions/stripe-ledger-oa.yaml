prompt: |
  Implement process_ledger(commands). It processes funding requests for
  financial accounts and returns a comma-separated string of balance
  results, one per BALANCE command, in input order. 4 parts unlock one at
  a time and build on each other; tests from earlier parts keep running
  against the final code. HackerRank, Python 3, 60 minutes.

  Commands:
    INIT <account_id> <starting_balance> — creates an account. Balance is
      in minor units and settles immediately. (Also seen as
      INIT <account_id> USD <starting_balance>.)
    FUND <ts> <account_id> <method> <amount> — adds amount through method.
      If the account doesn't exist, ignore the command.
    BALANCE <ts> <account_id> — reports the settled balance: starting
      balance plus every earlier accepted fund whose settlement day is at
      most the BALANCE's day.

  Input guarantees: 1 <= n <= 1000. Commands are well-formed and use only
  command types introduced by the part being tested. Account IDs are
  non-empty and contain no spaces. All INIT commands come before every
  timestamped command. If an account is INIT'd more than once, only the
  first INIT counts. Starting balances are non-negative; funding amounts
  are positive. Every amount and intermediate balance fits in a signed
  64-bit integer. Parts 1-2 use whole-day timestamps (1). Parts 3-4 use
  day,hour (1,16). The final solution must accept both; a timestamp with
  no comma means that day at hour 0.

  Part 1 — Funding with Settlement: funds count toward the balance only
  once settled. Commands are in chronological order; same-day commands are
  processed in input order. Every day is a weekday. Day 1 is Monday.
    WIRE settles the submission day. ACH settles one day after submission.

  Part 2 — Business Day Settlement: settlement respects business days; a
  third method appears. In each 7-day cycle, days 6 and 7 are Saturday and
  Sunday: day d is a weekend if d % 7 == 6 or d % 7 == 0.
    WIRE settles on the submission day; a weekend submission settles the
      following Monday.
    ACH settles one business day after submission; a weekend submission is
      treated as submitted on the following Monday.
    STABLECOIN settles on the submission day, including weekends.

  Part 3 — Cutoff Times: timestamps become <day>,<hour> with hour 0-23.
  Commands are in strict chronological order, no two share a timestamp. A
  BALANCE reports the state at its exact timestamp: a fund only affects
  commands after it.
    WIRE cutoff 17, ACH cutoff 20, STABLECOIN no cutoff.
    WIRE/ACH submitted before the cutoff counts as submitted that day;
      at or after the cutoff counts as submitted on the next business day.
    A weekend WIRE/ACH counts as submitted the following Monday,
      regardless of hour. STABLECOIN ignores cutoffs and weekends.
    Apply the Part 2 settlement rules to this effective submission day.
    Settlement is by calendar day, not hour: a fund settling on day d is
      visible to any later BALANCE on day d, regardless of hour, but never
      to a command before the FUND itself.

  Part 4 — Funding Limits: ACH requests have per-account limits against
  the effective submission day (after Part 3 cutoff/weekend rules):
    Daily: 5,000,000 minor units per effective business day.
    Weekly: 10,000,000 minor units per week (days 1-7 week 1, 8-14 week 2...).
  If an ACH request would make either limit exceed its maximum, reject the
  entire request. A rejected request never settles and doesn't count toward
  either limit. WIRE and STABLECOIN are not limited.
examples:
  - input: |
      INIT acct_1 10000
      FUND 1 acct_1 WIRE 5000
      FUND 1 acct_1 ACH 3000
      BALANCE 1 acct_1
      BALANCE 2 acct_1
    output: 15000,18000
    explanation: WIRE settles day 1, ACH settles day 2 (Part 1).
  - input: |
      INIT acct_1 0
      FUND 5 acct_1 WIRE 5000
      BALANCE 5 acct_1
      FUND 6 acct_1 STABLECOIN 1000
      BALANCE 6 acct_1
      FUND 6 acct_1 ACH 2000
      BALANCE 8 acct_1
      BALANCE 9 acct_1
    output: 5000,6000,6000,8000
    explanation: Sat STABLECOIN settles day 6; Sat ACH treated as Mon (day 8), settles Tue (day 9) (Part 2).
  - input: |
      INIT acct_1 0
      FUND 1,16 acct_1 WIRE 5000
      FUND 1,17 acct_1 WIRE 3000
      BALANCE 1,18 acct_1
      BALANCE 2,0 acct_1
    output: 5000,8000
    explanation: WIRE at 1,17 is at the 17 cutoff, so effective day 2 (Part 3).
  - input: |
      INIT acct_1 0
      FUND 1,10 acct_1 ACH 5000000
      FUND 1,11 acct_1 ACH 1000
      FUND 1,21 acct_1 ACH 4000000
      BALANCE 2,0 acct_1
      BALANCE 3,0 acct_1
      FUND 3,10 acct_1 ACH 2000000
      BALANCE 4,0 acct_1
    output: 5000000,9000000,9000000
    explanation: Second fund rejected (daily limit); last fund rejected (weekly limit) (Part 4).
constraints: n <= 1000; whole-day timestamps in Parts 1-2, day,hour in Parts 3-4; final solution accepts both
