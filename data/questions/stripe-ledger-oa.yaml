solution:
  approach: |
    Every FUND goes through three steps: (1) effective submission day via
    weekend + cutoff rules, (2) all-or-nothing limit check against the
    effective day, (3) settlement day = effective day + method lag in
    business days; store (settlement_day, amount) on the account. BALANCE
    on day d sums starting balance + stored settlements with
    settle_day <= d. Processing in input order gives Part 3's "never
    affects an earlier command" rule for free. Bare-day timestamps parse to
    hour 0 (before every cutoff) so Parts 1-2 tests keep passing.
  complexity:
    time: O(n^2) worst case (each BALANCE sums stored settlements); n <= 1000
    space: O(n) stored settlements
  code: |
    from collections import defaultdict

    SETTLEMENT_LAG = {"WIRE": 0, "ACH": 1, "STABLECOIN": 0}
    CUTOFF_HOUR = {"WIRE": 17, "ACH": 20}
    LIMITS = {"ACH": [("daily", 5_000_000, lambda d: d),
                      ("weekly", 10_000_000, lambda d: (d - 1) // 7)]}

    def is_weekend(day):
        return day % 7 in (6, 0)

    def next_business_day(day):
        day += 1
        while is_weekend(day):
            day += 1
        return day

    def parse_timestamp(token):
        day, _, hour = token.partition(",")
        return int(day), (int(hour) if hour else 0)

    def effective_day(method, day, hour):
        if method == "STABLECOIN":
            return day
        if is_weekend(day) or hour >= CUTOFF_HOUR[method]:
            return next_business_day(day)
        return day

    def settlement_day(method, eff_day):
        if method == "STABLECOIN":
            return eff_day
        for _ in range(SETTLEMENT_LAG[method]):
            eff_day = next_business_day(eff_day)
        return eff_day

    def try_use_limits(usage, account, method, eff_day, amount):
        keys = [(account, name, period(eff_day), cap)
                for name, cap, period in LIMITS.get(method, [])]
        if any(usage[key[:3]] + amount > key[3] for key in keys):
            return False
        for key in keys:
            usage[key[:3]] += amount
        return True

    def process_ledger(commands):
        starting = {}
        settlements = defaultdict(list)
        limit_usage = defaultdict(int)
        results = []
        for command in commands:
            parts = command.split()
            op = parts[0]
            if op == "INIT":
                starting.setdefault(parts[1], int(parts[-1]))
            elif op == "FUND":
                _, ts, account, method, amount = parts
                if account not in starting:
                    continue
                day, hour = parse_timestamp(ts)
                amount = int(amount)
                eff = effective_day(method, day, hour)
                if not try_use_limits(limit_usage, account, method, eff, amount):
                    continue
                settlements[account].append((settlement_day(method, eff), amount))
            elif op == "BALANCE":
                _, ts, account = parts
                if account not in starting:
                    continue
                day, _ = parse_timestamp(ts)
                results.append(starting[account] + sum(a for d, a in settlements[account] if d <= day))
        return ",".join(map(str, results))
  code_language: python
  pitfalls:
    - Cutoff is "at or after" (hour >= cutoff); the Part 3 example tests WIRE at exactly 17
    - Limits use exceed semantics - exactly 5,000,000 is accepted; bucket by effective day, not raw day
    - Rejected requests must not count toward any limit - check all limits first, record usage only on accept
    - First INIT wins (setdefault); INIT balance is the last token (INIT acct_1 USD 100)
    - FUND to unknown account is ignored
    - Integers for money (minor units), never floats
