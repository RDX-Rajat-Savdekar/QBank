prompt: |
  Design an in-memory RateLimiter.
  
  Interface: should_allow(timestamp, ip_address)
  
  An ip_address may have at most 80 accepted requests in the active window. If over the limit, return false. If allowed, return true and record the request.
  
  Active window for timestamp T is [T-3, T] inclusive (4-second sliding window). Do not record denied requests.
  
  Assumptions: single-process, single-machine; requests handled sequentially; timestamps are integer seconds and arrive non-decreasing. Standard collections only — no third-party rate-limiter libraries.
