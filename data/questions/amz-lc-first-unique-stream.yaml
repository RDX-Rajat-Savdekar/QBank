  relationship: similar
status: extracted
confidence: high
evidence: reddit
prompt: |
  Given an arbitrary length input stream of characters, return the first
  unique character that does not repeat anywhere in the stream.

  abcdabc → d
  aabbcdd → c
examples:
  - input: abcdabc
    output: d
  - input: aabbcdd
    output: c
follow_ups:
  - text: Time complexity
    kind: complexity
  - text: Improvements (online / streaming vs two-pass)
    kind: variant
solution:
  approach: |
    Count frequencies then scan for the first char with count 1. For a
    true stream, keep a queue of candidates plus a count/seen map and
    evict from the front when a character repeats.
  complexity:
    time: O(n)
    space: O(alphabet)
