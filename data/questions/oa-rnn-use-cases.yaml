prompt: |
  In which use cases would you opt for a recurrent neural network in TensorFlow? Select all that apply.
  A) Video detection
  B) Text analysis and classification
  C) Speech recognition
  D) Image processing
  E) Analysis of time series data
solution:
  approach: |
    A, B, C, and E. RNNs fit ordered sequences. A single static image has no time axis, so plain image processing is the option left out.
