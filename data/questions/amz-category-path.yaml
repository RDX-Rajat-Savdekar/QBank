prompt: |
  At Amazon, we analyze how customers navigate through product categories
  while shopping. Customers often start browsing in one category and end
  up purchasing in another through related product recommendations.

  Given a set of direct category relationships (based on customer browsing
  patterns), find one possible path a customer might take from one
  category to another. A relationship (A → B) means customers who viewed
  products in category A often viewed products in category B.

  Example Category Relationships:
    Electronics → Smart Home
    Electronics → Computers
    Electronics → Accessories
    Smart Home → Home & Kitchen
    Computers → Accessories
    Home & Kitchen → Kitchen Appliances

  Sample Query:
    Find paths from 'Electronics' to 'Kitchen Appliances'

  Valid paths would be:
    1. Electronics → Smart Home → Home & Kitchen → Kitchen Appliances
    2. Electronics → Computers → Accessories → Smart Home → Home & Kitchen → Kitchen Appliances

  Live prompt asked for one possible path, not necessarily the shortest.
examples:
  - input: "graph={'A':['B'],'B':['C']}, start='A', target='C'"
    output: "['A','B','C']"
  - input: "graph={'A':['B']}, start='A', target='Z'"
    output: "[]"
