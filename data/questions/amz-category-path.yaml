follow_ups:
  - text: Shortest path (fewest hops) instead of any path — unweighted BFS
    kind: variant
  - text: Weighted transitions (cost / conversion / traffic) — Dijkstra + parent pointers
    kind: variant
  - text: High TPS / sub-5ms — parent map instead of copying paths; cache or precompute frequent (start, target) pairs
    kind: scale
solution:
  approach: |
    Directed graph. Any-path can be DFS or BFS. Interview follow-up
    usually wants fewest hops: BFS with a visited set (cycles exist).
    Reconstruct via a parent map instead of storing a full path on every
    queue entry. Weighted edges → Dijkstra. At high read volume, do not
    run BFS/Dijkstra on every request; cache or batch-precompute.
  complexity:
    time: O(V + E)
    space: O(V)
  code_language: python
  code: |
    from collections import deque

    def find_category_path(graph, start, target):
        if not start or not target or start not in graph:
            return []
        if start == target:
            return [start]
        queue = deque([start])
        parent = {start: None}
        while queue:
            curr = queue.popleft()
            for neighbor in graph.get(curr, []):
                if neighbor in parent:
                    continue
                parent[neighbor] = curr
                if neighbor == target:
                    path = []
                    node = target
                    while node is not None:
                        path.append(node)
                        node = parent[node]
                    return path[::-1]
                queue.append(neighbor)
        return []
  pitfalls:
    - Live prompt is one possible path; do not assume shortest until asked
    - Cycles — must mark visited
    - start == target → [start]; missing nodes / disconnected → []
    - Copying path+[neighbor] on every enqueue is the latency trap
