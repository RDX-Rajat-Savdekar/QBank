prompt: |
  A starter project is image forgery detection. How can fake images be identified? Select all that apply.
  A) Using generalized models, OpenAI GPT-2 or ELMo
  B) By a GAN discriminator
  C) Leveraging transfer learning from ImageNet classification
  D) Image processing by an encoder-decoder of a recurrent neural network
  E) Using a CNN for image classification
solution:
  approach: |
    B, C, and E. A GAN discriminator is trained to separate real and synthetic images. ImageNet CNN backbones transfer visual features into a forgery classifier.
