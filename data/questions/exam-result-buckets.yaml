prompt: |
  Given exam scores for N students, return counts
  [failed, passedWithoutHonors, passedWithHonors].

  Failed: score < 50. Passed without honors: 50 <= score <= 80.
  Passed with honors: score > 80.
examples:
  - input: "[50, 80, 81, 99, 30, 77, 67]"
    output: "[1, 4, 2]"
starter: |
  def solution(A: list[int]) -> list[int]:
      pass
solution:
  approach: One pass, three counters. 50 and 80 are without honors. Above 80 is honors.
  complexity:
    time: O(N)
    space: O(1)
  pitfalls:
    - 50 and 80 are passed without honors, not failed and not honors
    - Return the three counts in that order, not the scores
