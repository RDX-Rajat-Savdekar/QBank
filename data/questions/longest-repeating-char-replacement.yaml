prompt: |
  Given a string `s` and an integer `k`, you may change at most `k` characters to any other uppercase letter. Return the length of the longest substring containing the same letter you can get after performing the operations.
examples:
  - input: 's = "ABAB", k = 2'
    output: '4'
  - input: 's = "AABABBA", k = 1'
    output: '4'
constraints: |
  - `1 <= s.length <= 10^5`
  - `s` consists of only uppercase English letters.
  - `0 <= k <= s.length`
