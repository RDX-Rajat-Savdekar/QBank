id: car-rental-backend
title: Car rental reservation backend
type: hld
tags: [practice]
topics: [design-api]
difficulty: medium
status: extracted
confidence: high
evidence: practice-curriculum
prompt: |
  Design the backend for a car rental web app. Users search available cars by city, capacity (S/M/L), and date range, and reserve one — with guaranteed no double-booking. User auth and payments are pre-built microservices (black boxes).
  
  Scale: 10M DAU, ~10M requests/day, 1M cars, 200 cities (~5,000 cars/city), reservations up to 1 year in advance.
  
  Focus: date-range availability (overlap query, not `Car.status`), double-booking prevention, double-payment prevention, Redis caching strategy and key design, post-commit event publishing.
  
  Variant: 1M individually-tracked cars across 2 cities with a strict no-double-booking requirement (locking strategy + sharding).
solution:
  approach: |
    Availability is an overlap query on reservations, not a mutable Car.status. Reserve with a conditional write / lock on (car_id, date range). Payments are a separate service — use an idempotency key and outbox events after commit. Cache search keys by city+capacity+date bucket.
  diagram: |
    graph TD
      Client --> API
      API --> Search
      API --> Reserve
      Search --> Redis
      Search --> DB[(Reservations)]
      Reserve --> DB
      Reserve --> Outbox
      Outbox --> Pay[Payments black box]
