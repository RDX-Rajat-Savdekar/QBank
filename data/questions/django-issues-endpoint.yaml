prompt: |
  A React + Django project-management app. `POST /api/issues` in `issue_views.py` is fully broken — returns 500 on every request, 0/6 tests passing. Fix it so issues are created correctly (per-team identifiers, validation, actual create, proper auth responses).

  Amazon OA variant (reported): simulated JIRA-like issue/ticketing system.
    - Create issue returns 502 → implement endpoint logic
    - Creating and linking subissues not working
    - Predefined tests reveal other required modifications
solution:
  approach: |
    Match the test expectations: auth 401/403, validate body, allocate a per-team id, actually call create, return the serialized issue.
