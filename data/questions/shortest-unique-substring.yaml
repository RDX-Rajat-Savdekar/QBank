id: shortest-unique-substring
title: Shortest unique substring
type: dsa
tags: [practice]
topics: [strings]
difficulty: medium
status: extracted
confidence: high
evidence: practice-curriculum
prompt: |
  Given a list of strings (e.g. country names), for each string find its shortest substring that does not appear as a substring of any other string in the list, and return the word with that substring wrapped in `<u>...</u>` tags. If no unique substring exists (the word is fully contained in another), return the plain word with no tags.
examples:
  - input: 'word "Dominica" in a list that also has "Dominican Republic"'
    output: 'Dominica'
    explanation: 'fully contained → unchanged, no tags'
solution:
  approach: |
    For each word, try substrings by increasing length (and left-to-right) until one is absent from every other word.
  links: [https://claude.ai/chat/006804e4-4432-4875-8748-9f114aa332db]
