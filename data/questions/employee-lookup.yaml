prompt: |
  Design an employee lookup app (search/CRUD over employee records) using a layered Controller–Service–Repository architecture. Discuss the stack (e.g. Spring Boot / PostgreSQL / React) plus production backend security (parameterized queries, auth, RBAC, input validation, rate limiting, DTOs, CORS, HTTPS, audit logging).
solution:
  approach: |
    Controller / Service / Repository. DTOs at the edge. Parameterized queries. Auth + RBAC on every write. Rate limit search. Audit log mutations.
