id: oa-data-sufficiency-y
title: Data sufficiency for the value of y
type: puzzle
tags: [oa, mock, aptitude]
topics: [math]
difficulty: easy
status: extracted
confidence: high
evidence: practice-curriculum
prompt: |
  What is the value of y?
  Statement 1: the square of y is 64.
  Statement 2: y(y - 8) = 0.
  A) Both statements together are sufficient, and neither statement alone is sufficient.
solution:
  approach: |
    A. Statement 1 allows 8 and -8. Statement 2 allows 0 and 8. Together only y = 8 remains.
