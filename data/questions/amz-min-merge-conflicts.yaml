id: amz-min-merge-conflicts
title: Minimum merge conflicts
type: dsa
tags: [oa-custom]
topics: [strings]
difficulty: hard
status: extracted
confidence: high
evidence: live-prompt
prompt: |
  Merge `primary` and `secondary` source-control branches while
  preserving the relative order of commits from each branch. Each
  character is a commit priority; earlier in the alphabet is higher
  priority. A conflict is a lower-priority commit placed before a
  higher-priority commit in the merge. Return the minimum number of
  conflicts over any valid merge. Function `getMinimumConflicts`.

  Example: primary = "zc", secondary = "d" → 2
  (merges "zcd" and "dzc" both have 2 conflicts; "zdc" has 3).
examples:
  - input: 'primary="zc", secondary="d"'
    output: "2"
constraints: |
  1 <= |primary|, |secondary| <= 1000
  lowercase English letters only
solution:
  approach: |
    Count inversions created by the forced interleaving order, both
    inside each string and across strings. Pick the merge that
    minimizes those inversions.
