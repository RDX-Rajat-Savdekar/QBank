prompt: |
  GoodCorp runs a data network modeled as an undirected, weighted graph
  ({node: [(neighbor, weight), ...]}, non-negative weights, integer node
  IDs), and one node has been corrupted. Never route data through the
  corrupted node.

  Part 1 (reachability): given source, destination, and corrupted node,
  return True if data can travel from source to destination without
  passing through the corrupted node, else False.

  Part 2 (minimal cost): given source and corrupted node, return a dict
  mapping every reachable, non-corrupted node to its minimal total edge
  weight from the source.
examples:
  - input: edges 1-2:4, 2-3:2, 1-4:1, 4-5:3, 5-6:2, 6-7:1, 7-9:5, 7-11:6, 9-11:2, 9-10:4, 8-10:2, 10-12:3; source 2, dest 9, corrupted 7
    output: "False (every path to 9 crosses node 7)"
  - input: same graph; source 2, dest 6, corrupted 7
    output: "True via 2, 1, 4, 5, 6"
  - input: same graph; Part 2 with source 2, corrupted 7
    output: "{2: 0, 3: 2, 1: 4, 4: 5, 5: 8, 6: 10} (nodes 7-12 absent)"
constraints: |
  Edges undirected (stored both ways). Weights non-negative. If source
  or destination is corrupted, or source not in graph: False (Part 1) /
  {} (Part 2). Source == destination: True (Part 1). If negative weights
  were possible, Dijkstra breaks — use Bellman-Ford.
