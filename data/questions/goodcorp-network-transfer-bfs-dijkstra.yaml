follow_ups:
  - text: Why BFS fails on weighted Part 2 — it finalizes on first discovery (min hops, not min cost); A->B direct 10 vs A->C->B 1+1=2
    kind: concept
  - text: Why the stale check in Dijkstra — heapq has no decrease-key, so outdated entries stay and must be skipped
    kind: concept
  - text: Weights only 0 or 1 — use 0-1 BFS with a deque, O(V + E)
    kind: variant
  - text: Destination also needed in Part 2 — read dist.get(destination), or stop early when the destination is popped
    kind: variant
  - text: Disconnected graph — unreachable nodes simply absent from the result
    kind: edge
solution:
  approach: |
    Part 1: BFS with a deque + visited set; never enqueue the corrupted
    node; mark visited when queued (not popped). Part 2: Dijkstra with a
    min-heap of (cost, node) and a dist dict; skip stale heap entries
    (cost > dist[node]); relax non-corrupted neighbors. Dijkstra is
    correct because with non-negative weights the cheapest heap pop is
    final.
  complexity:
    time: Part 1 O(V + E); Part 2 O((V + E) log V)
    space: Part 1 O(V); Part 2 O(V + E)
  code: |
    from collections import deque
    import heapq


    def can_transfer_data(graph, source, destination, corrupted):
        if source == corrupted or destination == corrupted:
            return False
        if source not in graph:
            return False
        if source == destination:
            return True
        queue = deque([source])
        visited = {source}
        while queue:
            current = queue.popleft()
            if current == destination:
                return True
            for neighbor, _ in graph.get(current, []):
                if neighbor != corrupted and neighbor not in visited:
                    visited.add(neighbor)
                    queue.append(neighbor)
        return False


    def get_min_costs(graph, source, corrupted):
        if source == corrupted or source not in graph:
            return {}
        dist = {source: 0}
        heap = [(0, source)]
        while heap:
            cost, node = heapq.heappop(heap)
            if cost > dist.get(node, float("inf")):
                continue
            for neighbor, weight in graph.get(node, []):
                if neighbor == corrupted:
                    continue
                new_cost = cost + weight
                if new_cost < dist.get(neighbor, float("inf")):
                    dist[neighbor] = new_cost
                    heapq.heappush(heap, (new_cost, neighbor))
        return dist
  code_language: python
  pitfalls:
    - Marking BFS nodes visited when popped (queues duplicates) instead of when queued
    - Forgetting to store each undirected edge in both directions
    - Using list.pop(0) instead of deque.popleft(), turning BFS into O(V^2)
    - Omitting the Dijkstra stale-entry check after pushing duplicate heap entries
