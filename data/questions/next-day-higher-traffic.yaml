prompt: 'You are given a time series representing daily traffic to a website. Compute the number of days from each day until the next day with strictly higher traffic. Input is a length-n list; output is a length-n list where index i is j-i for the first j>i with traffic[j] > traffic[i]. If never exceeded, return -1.'
examples:
  - input: '1,2,3,4'
    output: '1,1,1,-1'
  - input: '10, 8, 6, 8, 8, 11, 9'
    output: '5, 4, 1, 2, 1, -1, -1'
