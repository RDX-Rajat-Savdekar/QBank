prompt: |
  Validate a sequence of checkpoint positions before they are scheduled on a security appliance data plane.
  
  Checkpoints sit on a cyclic inspection ring and wrap after maxCheckpoint. Input may be untrusted and out of order.
  
  A sequence is valid iff:
  1. Every checkpoint <= maxCheckpoint.
  2. After ordering, no two adjacent checkpoints on the ring (including wrap-around from highest back to lowest) are closer than minSpacing.
