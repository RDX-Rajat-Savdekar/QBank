id: amz-min-inconvenience
title: Grid inconvenience minimization
type: dsa
tags: [oa-custom]
topics: [geometry/grid, binary-search]
difficulty: hard
status: extracted
confidence: high
evidence: live-prompt
prompt: |
  City grid: 1 = delivery center, 0 = empty. Distance is Chebyshev
  max(|dx|, |dy|). Inconvenience is the max distance of any 0-cell
  to its nearest center. Convert at most one 0 into a 1. Return the
  minimum possible inconvenience. Function `getMinInconvenience`.

  Example 2x4 grid with centers on the last column: initial
  inconvenience 3; adding a center at (0,0) drops it to 1.
follow_ups:
  - text: TLE on large grids if you recompute nearest-center naively per threshold
    kind: trap
  - text: all-zero grid (no centers)
    kind: trap
  - text: Chebyshev, not Manhattan
    kind: trap
solution:
  approach: |
    Binary search the inconvenience threshold. For a mid, multi-source BFS from existing centers (and optionally one new center) to test coverage.
  links: [https://claude.ai/chat/f861be36-a401-46d8-ab30-e2ecf7b99b38]
