prompt: |
  Find the minimum number of operations required to make all integers in an array equal. In one operation, any bit of any element can be flipped.
  
  Example: n=2, arr=[1, 2]. Flip 1 (01) → 3 (11), flip 2 (10) → 3 (11). Answer 2.
  
  Function: getMinOperations(arr)
examples:
