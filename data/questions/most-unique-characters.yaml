id: most-unique-characters
title: Most unique characters + Jaccard
type: dsa
tags: [oa-custom, 3-part]
topics: [strings, hashing]
difficulty: medium
status: extracted
confidence: high
evidence: practice-curriculum
prompt: |
  Input is a list of strings and a boolean flag. Function `solution(text, use_jaccard)`.
  
  Part 1 (`use_jaccard = False`): Select the strings whose most-common character has the *smallest* proportion relative to string length. Return a string of the characters that appear *only* in the selected strings (not in any non-selected string).
  
  Part 2 (`use_jaccard = True`): Same output format, but select strings by *lowest average Jaccard similarity* to all other strings (most dissimilar from the group).
  
  Part 3: Implement `jaccard(string1, string2)` yourself using multiset intersection / union.
examples:
  - input: '["aba","ab","abbcdd"], use_jaccard=False'
    output: 'cdd'
    explanation: 'select abbcdd (smallest most-common proportion); unique chars c,d,d'
solution:
  approach: |
    Part 1: per-string max-char frequency / length; pick the min. Part 2: average pairwise multiset Jaccard, pick the min. Output is concatenation of chars that appear only inside the selected set.
  pitfalls:
    - Jaccard is multiset, not set
    - ties in selection
