prompt: |
  Tell me about a time you had to communicate a change in direction that
  you anticipated people would have concern with.

  Follow-ups seen:
    - What was the proposal and what changes were made?
    - You proposed a phased approach; the team did not want it; you
      convinced them. Why, and what data supported the recommendation?
    - How were you transparent about the data with the team?
    - What was the final result?
    - If you had to do this again, would you change your approach?
