    kind: scale
solution:
  approach: |
    Part A: earliest-arrival in departure order. Sort a copy of flights
    by departure; keep earliest[airport]; relax destinations where
    earliest[src] <= depart. Earlier arrival is never worse for
    reachability, so one pass suffices. Part B: earliest arrival is NOT
    optimal (arriving earlier can mean waiting longer), so optimize cost
    per flight with DP in time order: cost[j] = depart_j + min over
    predecessor flights i of (cost[i] - arrive_i). Maintain
    best_at[airport] = min(cost[i] - arrive_i) incrementally with an
    event sweep (arrival events sort before departure events on ties),
    seeded best_at = {origin: 0} so origin wait falls out of the formula.
  complexity:
    time: O(F log F) both parts (F = flights)
    space: O(F + A) (A = airports)
  code: |
    def package_a(origin_airport, dest_airport, flights):
        if origin_airport == dest_airport:
            return True
        earliest = {origin_airport: 0}
        for src, dst, depart, arrive in sorted(flights, key=lambda f: f[2]):
            if src in earliest and earliest[src] <= depart:
                if dst not in earliest or arrive < earliest[dst]:
                    earliest[dst] = arrive
        return dest_airport in earliest


    def package_b(origin_airport, dest_airport, flights):
        if origin_airport == dest_airport:
            return 0
        events = []
        for i, (_, _, depart, arrive) in enumerate(flights):
            events.append((depart, 1, i))
            events.append((arrive, 0, i))
        events.sort()
        best_at = {origin_airport: 0}
        cost = [None] * len(flights)
        answer = float("inf")
        for _, kind, i in events:
            src, dst, depart, arrive = flights[i]
            if kind == 1:
                if src in best_at:
                    cost[i] = depart + best_at[src]
            elif cost[i] is not None:
                if dst == dest_airport:
                    answer = min(answer, cost[i])
                value = cost[i] - arrive
                if dst not in best_at or value < best_at[dst]:
                    best_at[dst] = value
        return -1 if answer == float("inf") else answer
  code_language: python
  pitfalls:
    - Writing < instead of <= in the catchable-flight check breaks the zero-wait connection case
    - Processing departures before arrivals on equal times (arrival events must sort first)
    - Counting wait at the destination after landing in Part B
    - Reusing Part A's earliest-arrival state for Part B (earlier arrival can mean longer wait)
