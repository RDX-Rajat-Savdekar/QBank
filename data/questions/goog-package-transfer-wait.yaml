difficulty: medium
status: extracted
confidence: high
evidence: friend-report
prompt: |
  Given an origin airport, a destination airport, and a list of flights,
  determine whether a package at the origin can reach the destination. A
  flight is [departure airport, arrival airport, departure time, arrival
  time]. The time the package leaves an airport must be greater than or
  equal to the time it arrived there. The package is at the origin at
  time 0.

  Part A (reachability): return True/False for whether the destination
  can be reached.

  Part B (follow-up, minimum waiting): return the least total time the
  package spends waiting in airports on a valid route, or -1 if
  unreachable. Waiting at the origin from time 0 counts; waiting at the
  destination after landing does not. Return 0 if origin equals
  destination.
examples:
  - input: origin SFO, dest LAX, flights [["SFO","SEA",2,4],["SEA","LAX",4,7]]
    output: "Part A: True (zero-wait connection at 4 allowed since leave >= arrive)"
  - input: same flights, Part B
    output: "2 (wait 2 at SFO, 0 at SEA)"
  - input: origin SFO, dest LAX, flights [["SFO","LAX",1,9],["SFO","SEA",5,6],["SEA","LAX",6,8]], Part B
    output: "1 (direct flight wins despite later arrival — earliest arrival is NOT optimal for waiting)"
constraints: |
  Flights are not sorted; do not modify the input. Times are
  non-negative ints; arrive > depart strictly. Leaving at exactly the
  arrival time is allowed (leave >= arrive). No flights / no route:
  False (Part A), -1 (Part B). Origin == destination: True (Part A),
  0 (Part B).
