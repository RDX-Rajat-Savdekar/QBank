follow_ups:
  - text: Diverse / dynamic layouts — HTML to cleaned text, config selectors, Playwright/vision fallback
    kind: variant
  - text: Efficient delta — SHA-256 gate, then line diff, ignore tiny diffs
    kind: variant
  - text: LLM cost — cheap classifier first, expensive reasoning only on high-urgency diffs
    kind: scale
  - text: Resource constraints — HTTP first, reuse browser contexts, block images/CSS
    kind: scale
  - text: Anti-bot / rate limits, JSON schema validation, store raw HTML in object storage
    kind: scale
solution:
  approach: |
    Pipeline: scheduler → scrape → clean/normalize → hash vs baseline →
    line diff → cheap model classify → expensive model only if high
    impact → alert + store. Do not send every scrape through a large
    model. Postgres for metadata/diffs, object storage for raw HTML.

    In the coding half, a WebScraperEngine with fetch / clean / hash /
    process_url is enough to start. Then add diff + classifier if time.
  diagram: |
    flowchart TD
      Sched[Scheduler / job queue] --> Scraper[Scraper engine]
      Scraper --> Sites[Competitor sites]
      Scraper --> Diff[Diff and filter]
      Diff -->|unchanged hash| Stop[Stop]
      Diff -->|meaningful delta| AI[Two-tier AI]
      AI --> Alerts[Alerts and store]
  pitfalls:
    - Over-designing class hierarchies instead of writing a working slice
    - Hashing raw HTML (layout noise) instead of cleaned text
    - Sending every scrape to a large model
    - Storing full HTML blobs in the relational table
