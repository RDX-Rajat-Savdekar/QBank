prompt: |
  How do you design an automated system that tracks competitor websites
  for new features, product updates, and business changes, analyzes the
  deltas using AI, and generates actionable insights?

  Core requirements:
    - Ingestion: periodic crawling/scraping of target competitor URLs
    - Change detection: meaningful content deltas, filter cosmetic/layout noise
    - AI analysis: classify updates and extract strategic insights
    - Delivery: structured alerts (Slack / email / webhooks) and historical audit logs

  Round shape: 10–15 min high-level design, then 25–30 min coding a
  working slice of the pipeline. Interviewer wanted complete basic
  working code (a couple of classes, a few methods each) — not a
  multi-class optimized architecture.
