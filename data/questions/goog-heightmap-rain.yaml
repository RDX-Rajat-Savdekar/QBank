prompt: |
  You are given a 2D heightMap. Rain water flows from a cell to the neighboring cell with the lowest height. Return the destination for each cell. Water only flows downward in height.
  
  Water goes greedily to the neighbor with the lowest height, then the next decision is taken from that cell. If the path reaches a boundary, the destination is the ocean.
