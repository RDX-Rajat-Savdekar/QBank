prompt: |
  Given daily movements of inventory, return an array of the total amount of daily inventory from day 0 through the maximum day present.
  
  Each transaction is {day, amount} (positive add, negative deduct). Multiple transactions may share a day. Missing days carry the previous running total. Output includes a leading 0 for inventory before day 0.
examples:
  - input: "[{ 'day': 0, 'amount': +10 }, { 'day': 0, 'amount': -5 }, { 'day': 1, 'amount': +3 }, { 'day': 3, 'amount': +10 }]"
    output: '[0, 5, 8, 8, 18]'
