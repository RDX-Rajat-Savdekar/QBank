prompt: |
  The average weight of ten children is 68.5 kg. Sam and John weigh 70 kg each. Find the average weight of the others.
solution:
  approach: |
    Total is 10 * 68.5 = 685. Remove 140. The other eight average 545 / 8 = 68.125 kg.
