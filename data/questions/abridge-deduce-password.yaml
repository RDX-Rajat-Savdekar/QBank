id: abridge-deduce-password
title: Deduce password / stateful file read
type: dsa
tags:
  - abridge
  - coderbyte
topics:
  - strings
difficulty: medium
status: extracted
confidence: high
evidence: practice-curriculum
prompt: |
  The platform repeatedly calls solve(files, clues). files is a stable list of full paths. clues contains one string for every file already read: the path, one space, and that file's password clue. On each call, return exactly one command string:

  - READ <full_path> to read one unread .txt file.
  - ROOT <password> after all useful files have been read and the password is determined.

  Only paths ending in .txt contain clues. Do not reread a file and do not read other file types. A space is required between the command and its argument.

  Clue token grammar (every clue has the same token count = password length):
  - A — exact alphanumeric character
  - . — no information (all 62 alphanumeric)
  - [ABPX] — one of the listed characters
  - [M-R] — inclusive same-case letter range
examples:
  - input: "files=['/a.txt']; clues=[]"
    output: 'READ /a.txt'
  - input: "files=['/a.txt']; clues=['/a.txt abc123']"
    output: 'ROOT abc123'
  - input: 'three .txt clues that intersect to SecretPassword'
    output: 'ROOT SecretPassword'
