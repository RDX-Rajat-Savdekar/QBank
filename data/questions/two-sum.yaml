  class Solution:
      def twoSum(self, nums: List[int], target: int) -> List[int]:
          pass
  
  # print(Solution().twoSum(...))  # e.g. nums = [2,7,11,15], target = 9
solution:
  approach: |
    One pass: store value → index. For each x, look up target-x.
  complexity:
    time: O(n)
    space: O(n)
  code: |
    def two_sum(nums, target):
        seen = {}
        for i, x in enumerate(nums):
            if target - x in seen:
                return [seen[target - x], i]
            seen[x] = i
        return []
  code_language: python
  pitfalls: [Do not reuse the same index]
