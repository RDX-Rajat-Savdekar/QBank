prompt: |
  Build an in-memory API: GET /menu and POST /orders (CommerceIQ setup-guide 'good prompt').
  
  Checkpoint 1: GET /menu (hardcoded items with prices), POST /orders with validation (unknown item_ids → 400, empty list → 422), order gets id + status created.
  Checkpoint 2: order total in a separate function; GET /orders/{id}; status created → paid → fulfilled with invalid-transition rejection.
  Checkpoint 3: inventory counts, decrement on order, reject when out of stock; then the race of two orders for the last item.
