prompt: |
  Given two strings `s` and `t`, return `true` if they are isomorphic — characters in `s` can be replaced to get `t` with a one-to-one (bijective) mapping that preserves order. No two characters may map to the same character; a character may map to itself.
examples:
  - input: '"egg" / "add"'
    output: 'true'
  - input: '"egg" / "ten"'
    output: 'false'
  - input: '"ab" / "aa"'
    output: 'false'
constraints: |
  - `1 <= s.length <= 5 * 10^4`
  - `t.length == s.length`
  - `s` and `t` consist of any valid ascii character.
