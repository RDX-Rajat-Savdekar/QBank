prompt: |
  R1 covered an end-to-end RAG system plus one behavioral STAR story.
  Restated from a shared interview-summary doc (not a verbatim transcript).

  RAG ingestion (Confluence docs to vector DB):
  - Extraction: loader (e.g. LangChain ConfluenceLoader) authenticates to
    source APIs and pulls raw content plus metadata (URLs, titles, timestamps).
  - Chunking: split large docs into coherent units (Markdown headers or
    Recursive Character Text Splitting) to fit LLM context limits.
  - Embedding: chunks pass through an embedding model
    (e.g. text-embedding-3-small) into dense float vectors.
  - Indexing: vectors plus raw text and metadata (access roles, domain
    filters) persisted to a Vector DB (ChromaDB/Qdrant) indexed with
    HNSW for fast similarity retrieval.

  Live query path: Master Agent routes the query through the same embedding
  model, runs Top-K cosine nearest-neighbor search, re-ranks/filters with a
  second-stage model (Cross-Encoder or LLM judge), injects top snippets into
  the system prompt, and generates a grounded answer.

  Retrieval quality: first-layer bi-encoder search is fast but lossy
  (near-identical codes like R01 vs R03 collide; topic match != answer
  match; 500-word chunks wash out details), so a Cross-Encoder / judge LLM
  reads query + chunk together for precision, with a fallback message when
  top relevance is below threshold (e.g. < 0.6).

  Chunking details: RCTS falls back through separators ["\n\n", "\n", " ", ""];
  tables are handled via header-injected row chunks, table summarization +
  raw retrieval, or JSON/key-value conversion. Chunk table columns:
  chunk_id (UUID PK), document_id (FK), embedding (vector), content (text),
  chunk_index (sequence), governance_meta (headings, access roles, URL, version).

  Infra: ChromaDB needs explicit string IDs such as
  "{document_id}_chunk_{index}". Single-host via docker-compose with a
  persistent volume; cloud via ECS/Fargate or Cloud Run; Kubernetes with a
  StatefulSet + PVC for the vector index. LangChain extraction =
  authenticate, CQL queries with pagination, BeautifulSoup parse into
  Document objects preserving metadata.

  Behavioral (STAR): Java/Spring Boot microservice ingesting trade feeds
  (SWIFT, XML, CSV), parsing Trade ID / Counterparty / Notional / ISIN,
  asset-class-based transformation, validation plus REST retry for zero
  message loss, achieving EOD reconciliation parity across two downstream
  systems.
