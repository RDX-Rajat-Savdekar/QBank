solution:
  approach: |
    Ingestion: extract with metadata, RCTS chunking, embed, HNSW index.
    Query: same-model embed, Top-K cosine, cross-encoder re-rank, threshold
    fallback, grounded generation. Tables via header-injected rows or
    summarize-then-fetch-raw. Composite chunk IDs enable context-window
    expansion via adjacent indices. Deploy stateless app + stateful vector
    store with persistent volumes.
  complexity:
    time: Retrieval dominated by ANN Top-K plus a bounded re-rank pass
    space: One dense vector per chunk plus raw text and metadata
  pitfalls:
    - Hashing or searching raw HTML instead of cleaned text
    - Sending every candidate chunk to an expensive judge model
    - Single-zero or leading-zero style ID mishandling in eval harnesses
    - Storing raw blobs in the relational table instead of object storage
