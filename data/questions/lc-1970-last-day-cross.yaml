prompt: 'There is a 1-based binary matrix where 0 is land and 1 is water. Initially the entire matrix is land. Each day a new cell in cells[i]=[ri,ci] floods. Find the last day you can walk from any top-row land cell to any bottom-row land cell (4 directions).'
leetcode:
  slug: last-day-where-you-can-still-cross
