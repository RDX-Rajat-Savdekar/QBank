  title: Last Day Where You Can Still Cross
  relationship: exact
examples:
  - input: 'row=2, col=2, cells=[[1,1],[2,1],[1,2],[2,2]]'
    output: '2'
  - input: 'row=2, col=2, cells=[[1,1],[1,2],[2,1],[2,2]]'
    output: '1'
constraints: |
  - `2 <= row, col <= 2 * 10^4`
  - `4 <= row * col <= 2 * 10^4`
  - `cells.length == row * col`
  - `1 <= ri <= row`
  - `1 <= ci <= col`
  - All the values of `cells` are unique.
