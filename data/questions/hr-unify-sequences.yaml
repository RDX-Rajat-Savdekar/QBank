prompt: |
  Two integer arrays arrA (n) and arrB (m). You may repeatedly replace any subsegment of either array with the sum of its elements. Maximize the length of the resulting arrays such that they become identical. If impossible, return -1.
  
  Example: arrA=[2,4,3,7,10], arrB=[6,5,5,10]. One operation on [1,5,6] of some array would become its sum (illustrative).
