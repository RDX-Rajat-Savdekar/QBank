solution:
  approach: |
    Undirected unweighted shortest path. Build an adjacency list, BFS
    from start, reconstruct via parent pointers. Bidirectional BFS if
    they push on N and depth.
  complexity:
    time: O(V + E)
    space: O(V + E)
  code_language: python
  code: |
    from collections import defaultdict, deque

    def shortestConnection(n, friendships, start, end):
        if start == end:
            return [start]
        adj = defaultdict(list)
        for u, v in friendships:
            adj[u].append(v)
            adj[v].append(u)
        parent = {start: None}
        q = deque([start])
        while q:
            curr = q.popleft()
            for neighbor in adj[curr]:
                if neighbor in parent:
                    continue
                parent[neighbor] = curr
                if neighbor == end:
                    path = []
                    node = end
                    while node is not None:
                        path.append(node)
                        node = parent[node]
                    return path[::-1]
                q.append(neighbor)
        return []
  pitfalls:
    - Friendships are bidirectional
    - Must return the node list, not just a boolean
    - Longer path is wrong even if it connects
