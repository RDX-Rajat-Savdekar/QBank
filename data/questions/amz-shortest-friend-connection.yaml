prompt: |
  SHORTEST FRIEND CONNECTION

  You are given n users (labeled 0 to n-1) and a list of bidirectional
  friendships where each friendship is represented as [u1, u2].

  Given two users, return the shortest chain of friends connecting them,
  or an empty list if no connection exists.

  Example 1:
    n = 5, friendships = [[0,1], [1,2], [2,3], [0,4], [4,3]]
    shortestConnection(0, 3) → [0, 4, 3]
      (not [0, 1, 2, 3] — that's longer)
    shortestConnection(0, 1) → [0, 1]

  Example 2:
    n = 4, friendships = [[0,1], [2,3]]
    shortestConnection(0, 3) → []  (no connection)

  Constraints:
    1 <= n <= 10^4
    0 <= u1, u2 < n
    No self-loops or duplicate edges
    Return the path including both endpoints
    If start == end, return [start]
