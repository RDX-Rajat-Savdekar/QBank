prompt: |
  Django wallet / Schedule Auto-Pay. Bugs seen on the live prompt:
  passcode 1234 fails despite being correct; even a successful
  create does not show up under "Your Auto-Payments".

  Expected: valid inputs create; invalid inputs rejected with the
  matching error; `process_recurring_payments` only runs payments
  that are due; skip insufficient funds; track last-paid so the
  next schedule is right. Six unit tests must pass.
solution:
  approach: |
    Create endpoint + management command + serializer must agree on schedule, next-run, and insufficient-balance behavior. Read the six tests before editing.
