prompt: |
  Choose the correct statement about this Java code.
  public interface CanFly { void fly(); }
  interface HasWings { public abstract Object getWingSpan(); }
  abstract class Falcon implements CanFly, HasWings { }
  Options include compile errors on the interface method lines, a compile error because Falcon does not implement the methods, and the code compiling without issues.
solution:
  approach: |
    The code compiles. Interface methods are implicitly public abstract, so writing that explicitly is valid. An abstract class does not have to implement the interface methods.
  pitfalls:
    - The source summary truncates some option wording. The recorded answer is that the snippet compiles.
