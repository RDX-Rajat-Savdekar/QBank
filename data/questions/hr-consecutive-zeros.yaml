prompt: |
  getMinOperations(s, m, k): s is a binary string. Ensure no contiguous run of 0s has length >= m. In one operation, pick any contiguous segment of length k and set every bit in it to 1. Return the minimum number of operations.
  
  Example: s="000000", m=3, k=2 → operate on [3,4] → "001100" → 1.
examples:
  - input: 's="000000", m=3, k=2'
    output: '1'
