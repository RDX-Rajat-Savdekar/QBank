id: tt-crystal-fields
title: Intersecting crystal influence fields
type: dsa
tags: [tiktok, codesignal, oa]
topics: [hashing, geometry/grid]
difficulty: medium
status: extracted
confidence: high
evidence: live-prompt
prompt: |
  Each crystal is an integer coordinate pair in `centers`. It projects a
  square field of influence with sides of length 2 around itself. Two
  fields intersect when they share at least one point, which is when the
  difference in each coordinate is at most 2:

  |x1 - x2| <= 2 and |y1 - y2| <= 2.

  Return how many pairs of crystals have intersecting fields. Different
  crystals may sit on the same coordinates, and those pairs intersect.
examples:
  - input: "centers = [[1, 1], [2, 2], [0, 4]]"
    output: "2"
    explanation: "(1,1) meets (2,2). (2,2) meets (0,4). (1,1) and (0,4) do not, because |4-1| = 3."
  - input: "centers = [[1, 1], [2, 2], [0, 4], [1, 1]]"
    output: "4"
    explanation: "The first three crystals still contribute 2 pairs. The fourth crystal shares (1,1), so it meets the first crystal and the second, and misses the third."
constraints: |
  - 1 <= centers.length <= 4 * 10^4
  - centers[i].length == 2
  - -10^5 <= centers[i][j] <= 10^5
  - Duplicate coordinates are allowed
  - Python 3, 4 seconds, 1 GB
starter: |
  def solution(centers):
      pass
solution:
  approach: |
    Count how many crystals share each coordinate. Pairs on the exact
    same point are C*(C-1)/2. For distinct points, only look at offsets
    dx in 0..2 and dy in -2..2, and skip dx == 0 with dy <= 0 so each
    unordered pair is counted once. Multiply the frequencies.
  complexity:
    time: O(n) expected
    space: O(n)
  code_language: python
  code: |
    from collections import defaultdict

    def solution(centers):
        freq = defaultdict(int)
        for x, y in centers:
            freq[(x, y)] += 1
        total = 0
        for count in freq.values():
            if count > 1:
                total += count * (count - 1) // 2
        for (x, y), c1 in freq.items():
            for dx in range(3):
                for dy in range(-2, 3):
                    if dx == 0 and dy <= 0:
                        continue
                    c2 = freq.get((x + dx, y + dy))
                    if c2:
                        total += c1 * c2
        return total
  pitfalls:
    - Same coordinates are a pair; do not skip duplicates
    - The offset scan must not count both (a, b) and (b, a)
    - A brute-force pair check is too slow at 4 * 10^4 crystals
