prompt: |
  Write a Python library that validates, compares, and modifies version strings
  defined by this BNF grammar:

    <version> ::= <major> | <major> "." <minor> | <major> "." <minor> "." <patch>
    <major>   ::= <number>
    <minor>   ::= <number>
    <patch>   ::= <number>
    <number>  ::= <digit> | <positive_digit> <digits>
    <digits>  ::= <digit> | <digit> <digits>
    <digit>   ::= "0" | <positive_digit>
    <positive_digit> ::= "1" | "2" | ... | "9"

  So a version is 1 to 3 dot-separated numbers with no leading zeros
  ("0" itself is fine, "01" and "1.02.3" are not).

  Required features:
  - Validation: is a string a valid version per the grammar?
  - Comparison: numeric (not lexicographic) ordering of versions.
  - Modification: bump major / minor / patch.

  Example version strings:
    Valid: "1", "1.10.2", "0.3"
    Invalid: "a.1.c" (non-numeric parts), "1.1.1-build2" (suffix not in grammar),
             "1.02.3" (leading zero in a number)
examples:
  - input: '"1", "1.10.2", "0.3"'
    output: "valid"
  - input: '"a.1.c", "1.1.1-build2", "1.02.3"'
    output: "invalid"
  - input: 'compare("1.10", "1.2")'
    output: "1 (numeric, not lexicographic)"
  - input: 'compare("1", "1.0.0")'
    output: "0 if missing parts count as 0"
constraints: |
  At most three dot-separated parts. Numbers have no leading zeros.
  Clarify with the interviewer whether "1" should equal "1.0.0" or keep
  its original precision — state the choice up front.
